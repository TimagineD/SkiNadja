function saveRental() {
  if (!rb) return;
  let client;
  if (rb.clientId) {
    client = clientById(rb.clientId);
    if (!client) {
      toast('Клиентот не постои', 'err');
      const tabBtn = document.querySelector('.rb-tab-btn[data-arg="gear"]');
      if (tabBtn) tabBtn.click();
      return;
    }
  } else {
    const { first, last, phone, card } = rb.newc;
    if (!norm(first) || !norm(phone)) {
      toast('Внеси име и телефон за клиентот во Чекор 1', 'err');
      const tabBtn = document.querySelector('.rb-tab-btn[data-arg="gear"]');
      if (tabBtn) tabBtn.click();
      return;
    }
    const ex = state.clients.find(c => norm(c.phone) === norm(phone));
    if (ex) {
      toast(`Веќе постои клиент со телефон ${esc(phone)}: ${esc(ex.first + ' ' + ex.last)} — избери го од пребарувањето`, 'err', 5000);
      const tabBtn = document.querySelector('.rb-tab-btn[data-arg="gear"]');
      if (tabBtn) tabBtn.click();
      return;
    }
    client = { id: uid(), first: norm(first), last: norm(last), phone: norm(phone), card: norm(card), createdAt: Date.now() };
    state.clients.push(client);
  }

  const items = [...rb.sel].map(id => eqById(id)).filter(Boolean);
  if (!items.length) {
    toast('Избери барем еден предмет во Чекор 1', 'err');
    const tabBtn = document.querySelector('.rb-tab-btn[data-arg="gear"]');
    if (tabBtn) tabBtn.click();
    return;
  }
  const rented = rentedEqIds();
  if (items.some(e => !e.enabled || rented.has(e.id))) {
    toast('Еден од избраните предмети е веќе недостапен', 'err');
    renderRBGrid();
    return;
  }
  const start = fromInput(rb.form.start) || Date.now();
  const exp = fromInput(rb.form.exp) || defaultExpected();
  if (exp <= start) { toast('Очекуваното враќање мора да е по почетокот', 'err'); return; }

  const no = ++state.meta.no;
  state.rentals.push({
    id: uid(), no, clientId: client.id, start, expected: exp, note: norm(rb.form.note),
    items: items.map(e => ({ eqId: e.id, cat: e.cat, name: e.name, size: e.size, price: e.price, returnedAt: null, damaged: false })),
    closedAt: null, total: null, paid: false, paidAt: null, payMethod: null
  });
  items.forEach(e => e.timesRented++);
  commit();
  closeAllModals();
  nav('dash');
  toast(`Изнајмено ${itemN(items.length)} на ${esc(client.first)}`);
}

          <label><input type="radio" name="ret-pay" value="cash" checked>Платено сега · готовина</label>
          <label><input type="radio" name="ret-pay" value="card">Платено сега · карта</label>
          <label><input type="radio" name="ret-pay" value="later">Ќе плати подоцна</label>
        </div>
      </div>
    </div>
    <div class="hint">Пресметка по календарски ден. Сумата може рачно да се коригира за попуст.</div>`,
    `<button class="btn sec" data-act="modal-close">Откажи</button>
     <button class="btn pri" data-act="ret-confirm" data-arg="${r.id}">Потврди враќање</button>`));
}

function confirmReturn(rid) {
  const r = rentalById(rid);
  if (!r) return;
  const now = Date.now();
  let retN = 0;
  r.items.forEach((it, i) => {
    if (it.returnedAt) return;
    const cb = document.getElementById('ret-' + i);
    if (cb && cb.checked) {
      it.returnedAt = now;
      retN++;
      const dm = document.getElementById('dmg-' + i);
      if (dm && dm.checked) {
        it.damaged = true;
        const e = eqById(it.eqId);
        if (e) {
          e.damaged = true;
          e.comment = (e.comment ? e.comment + ' · ' : '') + 'Оштетено при враќање ' + fmtD(now);
        }
      }
    }
  });

  const all = r.items.every(it => it.returnedAt);
  let pay = 'later';
  const pr = document.querySelector('input[name=ret-pay]:checked');
  if (pr) pay = pr.value;
  if (all) {
    r.closedAt = now;
    let tot = r.items.reduce((s, it) => s + it.price * calDays(r.start, it.returnedAt), 0);
    const v = parseFloat((document.getElementById('ret-total') || {}).value);
    if (!isNaN(v) && v >= 0) tot = v;
    r.total = tot;
  }
  if (pay !== 'later') {
    r.paid = true;
    r.paidAt = now;
    r.payMethod = pay === 'card' ? 'Карта' : 'Готовина';
  } else if (all) {
    r.paid = false;
  }
  commit();
  closeModal();
  const f = afterAction;
  afterAction = null;
  if (f) f();
  toast(all ? (r.paid ? `Вратено · наплатено ${money(rentalTotal(r))} (${r.payMethod})` : 'Вратено · останува ненаплатено')
    : `Делумно враќање · ${itemN(r.items.filter(i => !i.returnedAt).length)} останати`);
}

function runReport() {
  const fv = ($('#rp-from') || {}).value || isoDate(new Date());
  const tv = ($('#rp-to') || {}).value || isoDate(new Date());
  const f = d000(fv), t = d999(tv);
  if (f == null || t == null) return;
  const rows = state.rentals.filter(r => r.closedAt && r.closedAt >= f && r.closedAt <= t)
    .sort((a, b) => b.closedAt - a.closedAt);
  repLast = { from: f, to: t, rows };
  const tot = rows.reduce((s, r) => s + rentalTotal(r), 0);
  const paid = rows.filter(r => r.paid).reduce((s, r) => s + rentalTotal(r), 0);
  const perCat = CATS.map(c => {
    let cnt = 0, rev = 0;
    rows.forEach(r => r.items.forEach(it => {
      if (it.cat === c.id) {
        cnt++;
        rev += it.price * calDays(r.start, it.returnedAt || r.closedAt);
      }
    }));
    return { c, cnt, rev };
  }).filter(x => x.cnt);
  const byDay = {};
  rows.forEach(r => {
    const k = fmtD(r.closedAt);
    byDay[k] = byDay[k] || { n: 0, s: 0 };
    byDay[k].n++;
    byDay[k].s += rentalTotal(r);
  });

  $('#rep-body').innerHTML = `
    <div class="statline">
      <div class="statd"><span class="k">Изнајмувања</span><span class="v">${rows.length}</span></div>
      <div class="statd"><span class="k">Вкупно</span><span class="v">${money(tot)}</span></div>
      <div class="statd"><span class="k">Наплатено</span><span class="v">${money(paid)}</span></div>
      <div class="statd"><span class="k">Ненаплатено</span><span class="v ${tot - paid ? 'amb' : ''}">${money(tot - paid)}</span></div>
    </div>
    <div class="sec-t">По категории</div>
    <table class="rt">
      <tr><th>Категорија</th><th>Предмети</th><th>Приход</th></tr>
      ${perCat.map(x => `<tr><td>${x.c.e} ${x.c.n}</td><td>${x.cnt}</td><td>${money(x.rev)}</td></tr>`).join('') || '<tr><td colspan="3" class="mut">—</td></tr>'}
    </table>
    <div class="sec-t">По денови</div>
    <table class="rt">
      <tr><th>Датум</th><th>Изнајмувања</th><th>Приход</th></tr>
      ${Object.entries(byDay).sort((a, b) => d000a(a[0]) - d000a(b[0])).map(([k, v]) => `<tr><td>${k}</td><td>${v.n}</td><td>${money(v.s)}</td></tr>`).join('') || '<tr><td colspan="3" class="mut">—</td></tr>'}
    </table>
    <div class="hint">Период: ${fmtD(f)} – ${fmtD(t)} · според датумот на враќање на опремата.</div>
  `;
}

const d000a = s => {
  const [d, m, y] = s.split('.').map(Number);
  return new Date(y, m - 1, d).getTime();
};

/* ---------- backup / restore / csv ---------- */
const stamp = () => {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
};

function dl(name, content, mime = 'text/csv;charset=utf-8') {
  const a = document.createElement('a');
  const b = new Blob(['\ufeff' + content], { type: mime });
  a.href = URL.createObjectURL(b);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function doBackup() {
  state.meta.lastBackupAt = Date.now();
  dl(`skirental-rezerva-${stamp()}.json`, JSON.stringify({ ...state, exportedAt: Date.now() }, null, 2), 'application/json');
  save();
  renderPage();
  toast('Резервната копија е превземена');
}

const csvCell = v => {
  v = String(v ?? '');
  return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
};
const csvRow = (...c) => c.map(csvCell).join(';');

function exportCSV(kind) {
  const num = v => (v.toFixed(2) + '').replace('.', ',');
  if (kind === 'eq') {
    const rented = rentedEqIds();
    dl('oprema.csv', [
      csvRow('Име', 'Категорија', 'Големина', 'Цена/ден', 'Статус', 'Вклучена', 'Изнајмувања', 'Оштетена', 'Белешка'),
      ...filteredEq().map(e => {
        const st = !e.enabled ? 'Исклучена' : (rented.has(e.id) ? 'Изнајмена' : 'Слободна');
        return csvRow(e.name, catName(e.cat), e.size, num(e.price), st, e.enabled ? 'Да' : 'Не', e.timesRented, e.damaged ? 'Да' : 'Не', e.comment);
      })
    ].join('\n'));
  }
  if (kind === 'cl') {
    dl('klienti.csv', [
      csvRow('Име', 'Презиме', 'Телефон', 'Картичка', 'Изнајмувања'),
      ...state.clients.map(c => csvRow(c.first, c.last, c.phone, c.card, clientRentCount(c.id)))
    ].join('\n'));
  }
  if (kind === 'ren') {
    dl('iznajmuvanja.csv', [
      csvRow('Билет', 'Клиент', 'Телефон', 'Почеток', 'Враќање', 'Опрема', 'Дена', 'Сума', 'Платено', 'Начин', 'Белешка'),
      ...state.rentals.slice().sort((a, b) => b.start - a.start).map(r => csvRow(
        '#' + pad4(r.no), clientLabel(r.clientId), clientPhone(r.clientId), fmtDT(r.start),
        r.closedAt ? fmtDT(r.closedAt) : 'активна',
        r.items.map(it => `${catName(it.cat)} ${it.name} ${it.size || ''}`).join(' + '),
        calDays(r.start, r.closedAt || Date.now()), num(rentalTotal(r)), r.paid ? 'Да' : 'Не', r.payMethod || '', r.note
      ))
    ].join('\n'));
  }
  toast('CSV-то е превземено');
}

function onRestoreFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  e.target.value = '';
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.clients) || !Array.isArray(d.equipment) || !Array.isArray(d.rentals) || !d.settings) throw 0;
      confirmBox({
        title: 'Вчитај резервна копија',
        ok: 'Вчитај',
        msg: `Копијата содржи ${d.clients.length} клиенти, ${d.equipment.length} предмети и ${d.rentals.length} изнајмувања. Тековните податоци ќе бидат заменети.`,
        onOk: () => {
          state = d;
          state.meta = Object.assign({ no: 0, lastBackupAt: Date.now(), createdAt: Date.now() }, state.meta || {});
          if (!state.meta.no) state.meta.no = state.rentals.length;
          closeAllModals();
          nav('dash');
          commit();
          toast('Резервната копија е вчитана');
        }
      });
    } catch (err) {
      toast('Невалидна резервна копија', 'err');
    }
  };
  rd.readAsText(f);
}

    const re = el.dataset.re;
    afterAction = re ? (re === 'det' ? () => { closeModal(); closeModal(); openRentalDetail(a); } : () => { closeModal(); closeModal(); openClientModal(re); }) : null;
    openReturn(a);
  },
  'rental-del': a => {
    const r = rentalById(a);
    if (!r) return;
    confirmBox({
      title: 'Избриши изнајмување', ok: 'Избриши', danger: true,
      msg: `Билет #${pad4(r.no)} ќе биде избришан ${r.closedAt ? 'од историјата и од плаќањата' : 'и опремата веднаш ослободена'}. Ова не може да се врати.`,
      onOk: () => {
        r.items.forEach(it => {
          const e = eqById(it.eqId);
          if (e && e.timesRented > 0) e.timesRented--;
        });
        state.rentals = state.rentals.filter(x => x.id !== a);
        closeAllModals();
        commit();
        toast('Изнајмувањето е избришано');
      }
    });
  },

    const m = (document.querySelector('input[name=paym]:checked') || {}).value || 'Готовина';
    r.paid = true;
    r.paidAt = Date.now();
    r.payMethod = m;
    commit();
    closeModal();
    const f = afterAction;
    afterAction = null;
    if (f) f();
    toast(`Наплатено ${money(rentalTotal(r))} (${esc(m)})`);
  },
  'pay-unmark': a => {
    const r = rentalById(a);
    if (!r) return;
    r.paid = false;
    r.payMethod = null;
    r.paidAt = null;
    commit();
    closeModal();
    openRentalDetail(a);
    toast('Наплатата е поништена');
  },
  'client-view': a => openClientModal(a),
  'client-history': a => openClientHistory(a),
  'client-edit': a => openClientForm(a),
  'client-new': () => openClientForm(),
  'client-save': a => saveClient(a),
  'client-del': a => {
    const c = clientById(a);
    if (!c) return;
    if (clientHasActive(a)) { toast('Клиентот има активно изнајмување — врати ја прво опремата', 'err', 5000); return; }
    const n = clientRentCount(a);
    confirmBox({
      title: 'Избриши клиент', ok: 'Избриши', danger: true,
      msg: `${esc(c.first + ' ' + (c.last || ''))}${n ? ` има ${n} ${n === 1 ? 'изнајмување' : 'изнајмувања'} во историјата — тие ќе останат, но без поврзан клиент.` : ' ќе биде избришан.'}`,
      onOk: () => {
        state.clients = state.clients.filter(x => x.id !== a);
        closeAllModals();
        commit();
        toast('Клиентот е избришан');
      }
    });
  },
  'eq-new': () => openEqForm(),
  'eq-row': (a, el) => {
    if (el.dataset.arg === undefined) return;
    if (ui.eq.mode === 'sel') {
      ui.eq.sel.has(a) ? ui.eq.sel.delete(a) : ui.eq.sel.add(a);
      renderPage();
    } else {
      openEqForm(a);
    }
  },
  'eq-del': a => {
    if (rentedEqIds().has(a)) { toast('Опремата е моментално изнајмена — не може да се избрише', 'err', 5000); return; }
    const e = eqById(a);
    if (!e) return;
    confirmBox({
      title: 'Избриши опрема', ok: 'Избриши', danger: true,
      msg: `„${esc(e.name)} ${esc(e.size || '')}“ ќе биде избришана од инвентарот. Историјата на изнајмувања останува зачувана.`,
      onOk: () => {
        state.equipment = state.equipment.filter(x => x.id !== a);
        commit();
        toast('Опремата е избришана');
      }
    });
  },
  'eq-save': a => saveEq(a),
  'eq-toggle': a => {
    const e = eqById(a);
    if (!e) return;
    e.enabled = !e.enabled;
    commit();
  },
  'eq-mode': () => {
    ui.eq.mode = ui.eq.mode === 'sel' ? 'normal' : 'sel';
    if (ui.eq.mode === 'normal') ui.eq.sel.clear();
    renderPage();
  },
  'eq-selall': () => {
    filteredEq().forEach(e => ui.eq.sel.add(e.id));
    renderPage();
  },
  'eq-bulk': () => openBulkAdd(),
  'bulk-add': () => applyBulkAdd(),
  'eq-bulk-price': () => {
    if (!ui.eq.sel.size) { toast('Прво избери опрема', 'err'); return; }
    openModal(mShell('Постави цена за избраните', `
      <div class="frow">
        <label>Цена по ден (${curSym()})</label>
        <input type="number" id="bp-val" min="0" step="0.5" placeholder="пр. 2.5">
      </div>
      <p class="note">Ќе биде применета на ${ui.eq.sel.size} ${ui.eq.sel.size === 1 ? 'предмет' : 'предмети'}.</p>`,
      `<button class="btn sec" data-act="modal-close">Откажи</button>
       <button class="btn pri" data-act="bp-apply">Примени</button>`));
  },
  'bp-apply': () => {
    const v = parseFloat(($('#bp-val') || {}).value);
    if (isNaN(v) || v < 0) { toast('Внеси валидна цена', 'err'); return; }
    let n = 0;
    ui.eq.sel.forEach(id => {
      const e = eqById(id);
      if (e) { e.price = v; n++; }
    });
    ui.eq.mode = 'normal';
    ui.eq.sel.clear();
    closeModal();
    commit();
    toast(`Цената е поставена на ${money(v)} за ${itemN(n)}`);
  },
  'eq-bulk-del': () => {
    const ids = [...ui.eq.sel];
    if (!ids.length) return;
    const rented = rentedEqIds();
    const del = ids.filter(id => !rented.has(id));
    const skip = ids.length - del.length;
    if (!del.length) { toast('Избраната опрема е моментално изнајмена — не може да се избрише', 'err', 5000); return; }
    confirmBox({
      title: 'Избриши опрема', ok: 'Избриши', danger: true,
      msg: `${del.length} ${del.length === 1 ? 'предмет' : 'предмети'} ќе бидат избришани.${skip ? ` ${skip} изнајмени ќе бидат прескокнати.` : ''}`,
      onOk: () => {
        const set = new Set(del);
        state.equipment = state.equipment.filter(e => !set.has(e.id));
        ui.eq.mode = 'normal';
        ui.eq.sel.clear();
        commit();
        toast(`Избришани ${itemN(del.length)}`);
      }
    });
  },
  settings: () => openSettings(),
  'settings-save': () => saveSettings(),
  'backup-now': () => doBackup(),
  'backup-later': () => {
    state.meta.lastBackupAt = Date.now();
    save();
    renderPage();
  },
  restore: () => $('#file-restore').click(),
  'demo-load': () => {
    const has = state.clients.length || state.equipment.length || state.rentals.length;
    const run = () => { seedDemo(); closeAllModals(); nav('dash'); commit(); toast('Пробните податоци се вчитани'); };
    if (has) confirmBox({ title: 'Вчитај пробни податоци', ok: 'Вчитај', msg: 'Тековните податоци ќе бидат заменети со подготвени пробни податоци.', onOk: run });
    else run();
  },
  'wipe-all': () => confirmBox({
    title: 'Избриши сè', ok: 'Избриши сè', danger: true,
    msg: 'Сите клиенти, опрема и изнајмувања ќе бидат трајно избришани од овој уред. Препорака: превземи резервна копија прво.',
    onOk: () => {
      state = freshState();
      save();
      closeAllModals();
      nav('dash');
      renderPage();
      refreshBadges();
      toast('Сите податоци се избришани');
    }
  }),
  'export-csv': a => exportCSV(a),
  'report-open': () => openReport(),
  'report-run': () => runReport(),
  'report-csv': () => repCSV(),
  'report-print': () => repPrint(),
  'rb-pick': a => {
    if (!rb) return;
    rb.clientId = a;
    rb.clientMode = 'picked';
    rb.newc = { first: '', last: '', phone: '', card: '' };
    renderRBClient();
    renderRBTicket();
  },
  'rb-new': () => {
    if (!rb) return;
    rb.clientMode = 'form';
    renderRBClient();
  },
  'rb-clear-client': () => {
    if (!rb) return;
    rb.clientId = null;
    rb.clientMode = 'search';
    rb.newc = { first: '', last: '', phone: '', card: '' };
    renderRBClient();
    renderRBTicket();
  },
  'rb-edit-new': () => {
    if (!rb) return;
    rb.clientMode = 'form';
    renderRBClient();
  },
  'rb-tile': a => {
    if (!rb) return;
    rb.sel.has(a) ? rb.sel.delete(a) : rb.sel.add(a);
    renderRBGrid();
    renderRBTicket();
  },
  'rb-tab': a => {
    if (!rb) return;
    rb.tab = a;
    const rbEl = $('.rb');
    if (rbEl) rbEl.setAttribute('data-tab', a);
    document.querySelectorAll('.rb-tab-btn').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-arg') === a);
    });
    const mbody = $('.mbody');
    if (mbody) mbody.scrollTop = 0;
    if (a === 'ticket') renderRBTicket();
  },
  'rb-dur': a => {
    if (!rb) return;
    const days = parseInt(a, 10) || 1;
    const st = fromInput(rb.form.start) || Date.now();
    const h = state.settings.expectedHour || 17;
    const d = new Date(st + (days - 1) * 864e5);
    let t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, 0).getTime();
    if (t <= st) t += 864e5;
    rb.form.exp = toInput(t);
    const inp = $('#rb-exp');
    if (inp) inp.value = rb.form.exp;
    updateTkEst();
  },
  'rb-save': () => saveRental(),
  'ret-confirm': a => confirmReturn(a),
  'confirm-ok': () => {
    const cb = pendingConfirm;
    pendingConfirm = null;
    closeModal();
    if (cb) cb();
  },
  'modal-close': () => closeModal(),
  'modal-back': (a, el, e) => {
    if (e.target === el) closeModal();
  }
};

/* ---------- input routing ---------- */
let debT = null;
const renderListsSoon = () => {
  clearTimeout(debT);
  debT = setTimeout(renderPage, 110);
};

function onFormInput(e) {
  const t = e.target;
  if (!t || t.id === 'file-restore') return;
  const id = t.id;
  switch (id) {
    case 'q-dash': ui.dash.q = t.value; renderListsSoon(); break;
    case 'q-ren-a': ui.ren.qa = t.value; renderListsSoon(); break;
    case 's-ren-a': ui.ren.sa = t.value; renderPage(); break;
    case 'q-ren-h': ui.ren.qh = t.value; renderListsSoon(); break;
    case 'f-h-from': ui.ren.from = t.value; renderPage(); break;
    case 'f-h-to': ui.ren.to = t.value; renderPage(); break;
    case 'f-h-cat': ui.ren.cat = t.value; renderPage(); break;
    case 'f-h-paid': ui.ren.paid = t.value; renderPage(); break;
    case 's-h': ui.ren.sort = t.value; renderPage(); break;
    case 'q-eq': ui.eq.q = t.value; renderListsSoon(); break;
    case 'f-eq-status': ui.eq.status = t.value; renderPage(); break;
    case 's-eq': ui.eq.sort = t.value; renderPage(); break;
    case 'q-cl': ui.cl.q = t.value; renderListsSoon(); break;
    case 'f-cl': ui.cl.onlyActive = t.value === '1'; renderPage(); break;
    case 's-cl': ui.cl.sort = t.value; renderPage(); break;
    case 'q-pay': ui.pay.q = t.value; renderListsSoon(); break;
    case 'f-pay-status': ui.pay.status = t.value; renderPage(); break;
    case 'f-pay-from': ui.pay.from = t.value; renderPage(); break;
    case 'f-pay-to': ui.pay.to = t.value; renderPage(); break;
    case 's-pay': ui.pay.sort = t.value; renderPage(); break;
    case 'rb-qc': if (rb) { rb.qc = t.value; renderRBResults(); } break;
    case 'rb-qg': if (rb) { rb.qg = t.value; renderRBGrid(); } break;
    case 'rb-start': if (rb) { rb.form.start = t.value; updateTkEst(); } break;
    case 'rb-exp': if (rb) { rb.form.exp = t.value; updateTkEst(); } break;
    case 'rb-note': if (rb) rb.form.note = t.value; break;
    case 'rb-first': if (rb) { rb.newc.first = t.value; updateTkClient(); } break;
    case 'rb-last': if (rb) { rb.newc.last = t.value; updateTkClient(); } break;
    case 'rb-phone': if (rb) { rb.newc.phone = t.value; updateTkClient(); } break;
    case 'rb-card': if (rb) rb.newc.card = t.value; break;
    case 'rp-from': case 'rp-to': runReport(); break;
    case 'ef-cat': {
      const h = catById(t.value).hint;
      const si = $('#ef-size');
      if (si) si.placeholder = 'пр. ' + h;
      break;
    }
  }
}

/* ---------- live ticker ---------- */
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const r = rentalById(el.dataset.timer);
    if (!r) return;
    const active = !r.closedAt;
    el.innerHTML = active ? liveTimerHTML(now - r.start) : fmtDur(r.closedAt - r.start);
    const row = el.closest('[data-rrow]');
    if (row && active) {
      const late = isLate(r, now);
      row.classList.toggle('late', late);
      const lw = row.querySelector('[data-latewrap]');
      if (lw) lw.classList.toggle('hidden', !late);
      const c = row.querySelector('[data-cost]');
      if (c) c.textContent = costLine(r, now);
    }
  });
  const dc = $('#dash-clock');
  if (dc) dc.textContent = clockText(now);
}

/* ---------- global listeners & initialization ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const A = Acts[el.dataset.act];
  if (A) A(el.dataset.arg, el, e);
});

document.addEventListener('input', onFormInput);
document.addEventListener('change', onFormInput);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalStack.length) closeModal();
    return;
  }
  if (e.key === '/' && !modalStack.length) {
    const t = e.target;
    if (t && /input|select|textarea/i.test(t.tagName)) return;
    const map = { dash: '#q-dash', ren: ui.ren.seg === 'active' ? '#q-ren-a' : '#q-ren-h', eq: '#q-eq', cl: '#q-cl', pay: '#q-pay' };
    const el = document.querySelector(map[ui.page]);
    if (el) {
      e.preventDefault();
      el.focus();
    }
  }
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.settings.theme === 'auto' || !state.settings.theme) {
    updateThemeIcons();
  }
});

document.getElementById('file-restore').addEventListener('change', onRestoreFile);

mountApp();
nav('dash');
setInterval(tick, 1000);
</script>
</body>
</html>
